<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/foundation/5.5.3/css/foundation.min.css" rel="stylesheet">
        <script type="module">
            import {TheiaStickySidebar} from '/lib/theia-sticky-sidebar.ts';
            import {testTheiaStickySidebars} from '/lib/test.ts';

            document.addEventListener('DOMContentLoaded', function () {
                new TheiaStickySidebar({
                    elements: 'section .columns',
                    additionalMarginTop: 30,
                    // Disabled so that the test below can measure sidebar offsets synchronously after each scroll.
                    enableRequestAnimationFrame: false
                });
            });

            document.querySelector('#start_test').addEventListener('click', element => {
                element.disabled = true;
                testTheiaStickySidebars();
            });
        </script>
        <style>
            header, footer {
                margin: 20px 0;
            }

            .columns > div {
                background: linear-gradient(
                        135deg,
                        rgba(109,179,242,1) 0,
                        rgba(84,163,238,1) 50%,
                        rgba(54,144,240,1) 50%,
                        rgba(30,105,222,1) 100%
                        );
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>Theia Sticky Sidebar - <a href="http://foundation.zurb.com/">Foundation</a> example</h1>
            
            <button id="start_test">Run the self-assessment test</button> (May take a while. Be sure to not scroll or resize the window.)
        </div>
        
        <header>
            <div class="row">
                <div class="small-12 columns">
                    <div style="height: 200px;"></div>
                </div>
            </div>
        </header>

        <section>
            <div class="row">
                <div class="small-3 columns">
                    <div style="height: 300px;"></div>
                </div>
                
                <div class="small-6 columns">
                    <div style="height: 1000px;"></div>
                </div>
                
                <div class="small-3 columns">
                    <div style="height: 800px;"></div>
                </div>
            </div>
        </section>

        <footer>
            <div class="row">
                <div class="small-12 columns">
                    <div style="height: 400px;"></div>
                </div>
            </div>
        </footer>
    </body>
</html>
